<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Phoenix v10.2 架构图（交互式 Canvas）</title>
<style>
  :root{
    --bg:#0b1020; --panel:#121a33; --panel2:#0e1630; --ink:#e8eeff; --dim:#8fa0c8;
    --line:#26325c; --accent:#59b0ff; --ok:#3ddc97; --warn:#ffc857; --bad:#ff6b6b;
    --opt:#b48cff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:13px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;overflow:hidden}
  #app{display:grid;grid-template-columns:238px 1fr 372px;grid-template-rows:52px 1fr;
       height:100vh}
  header{grid-column:1/4;display:flex;align-items:center;gap:14px;padding:0 16px;
    background:linear-gradient(90deg,#0d1530,#101a38);border-bottom:1px solid var(--line)}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.3px}
  header .ver{color:var(--accent);font-weight:600}
  header .stat{color:var(--dim);font-size:12px}
  header input{flex:0 0 280px;margin-left:auto;background:#0a1226;border:1px solid var(--line);
    color:var(--ink);border-radius:6px;padding:6px 10px;outline:none}
  header input:focus{border-color:var(--accent)}
  header button{background:#16203f;border:1px solid var(--line);color:var(--ink);
    border-radius:6px;padding:6px 10px;cursor:pointer}
  header button:hover{border-color:var(--accent)}
  aside{background:var(--panel2);border-right:1px solid var(--line);overflow:auto;padding:10px}
  aside h2{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);
    margin:14px 4px 6px}
  .layerToggle{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;
    cursor:pointer;user-select:none}
  .layerToggle:hover{background:#16203f}
  .layerToggle .sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
  .layerToggle .n{flex:1;font-size:12px}
  .layerToggle .c{color:var(--dim);font-size:11px}
  .legendRow{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim);
    padding:3px 6px}
  .badge{display:inline-block;padding:1px 6px;border-radius:9px;font-size:10.5px;
    border:1px solid currentColor;line-height:1.5}
  main{position:relative;overflow:hidden;background:
    radial-gradient(1200px 600px at 30% 0%,#101a38 0%,#0b1020 60%)}
  canvas{display:block;width:100%;height:100%;cursor:grab}
  canvas.dragging{cursor:grabbing}
  #hint{position:absolute;left:12px;bottom:10px;color:var(--dim);font-size:11px;
    pointer-events:none}
  #panel{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px}
  #panel h3{margin:0 0 4px;font-size:14px}
  #panel .sub{color:var(--dim);font-size:11.5px;margin-bottom:12px}
  #panel .sec{margin:14px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:1px;
    color:var(--dim)}
  #panel .files{display:flex;flex-wrap:wrap;gap:4px}
  #panel .file{background:#0a1226;border:1px solid var(--line);border-radius:5px;
    padding:2px 6px;font-family:Consolas,monospace;font-size:11px;color:#bfd0f0}
  #panel p{margin:6px 0}
  #panel code{font-family:Consolas,monospace;font-size:11.5px;color:#9fd0ff}
  #panel .empty{color:var(--dim);font-size:12px}
  #index{position:absolute;inset:auto 0 0 0;max-height:42%;overflow:auto;
    background:rgba(8,13,28,.96);border-top:1px solid var(--line);padding:10px 14px;
    display:none}
  #index h4{margin:0 0 8px;font-size:12px}
  #index .g{margin-bottom:8px}
  #index .g b{font-size:11.5px;color:var(--accent)}
  #index .g span{font-family:Consolas,monospace;font-size:11px;color:#a9bbe0;
    margin-right:8px;white-space:nowrap}
  .k{color:var(--dim)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Phoenix <span class="ver">v10.2</span> 架构图</h1>
    <span class="stat" id="stat"></span>
    <input id="search" placeholder="搜索模块 / 文件 / 职责…  (Ctrl+K)">
    <button id="fitBtn">复位视图</button>
    <button id="indexBtn">全量文件索引</button>
  </header>

  <aside>
    <h2>层次</h2>
    <div id="layers"></div>
    <h2>状态图例</h2>
    <div class="legendRow"><span class="badge" style="color:#3ddc97">已验证</span>本轮实测通过</div>
    <div class="legendRow"><span class="badge" style="color:#b48cff">默认关闭</span>opt-in / 需显式开启</div>
    <div class="legendRow"><span class="badge" style="color:#ffc857">边界</span>绕开或有限制</div>
    <div class="legendRow"><span class="badge" style="color:#8fa0c8">稳定</span>既有能力</div>
    <h2>覆盖检查</h2>
    <div id="audit" class="legendRow" style="display:block;line-height:1.7"></div>
    <h2>操作</h2>
    <div class="legendRow">拖拽平移 · 滚轮缩放 · 双击复位</div>
    <div class="legendRow">点击节点看详情 · 左侧可开关层次</div>
  </aside>

  <main>
    <canvas id="cv"></canvas>
    <div id="hint">Phoenix v10.2 · 10 层 · 点击任意模块查看文件与职责</div>
    <div id="index"></div>
  </main>

  <section id="panel">
    <div class="empty">← 点击左侧画布中的任意模块查看详情</div>
  </section>
</div>

/* ================= 画布 ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const panel = document.getElementById('panel');
const statEl = document.getElementById('stat');
const auditEl = document.getElementById('audit');
const layersEl = document.getElementById('layers');

const BOX_W = 232, BOX_H = 62, GAP_X = 14, GAP_Y = 12, PAD = 24, HEAD = 30;
const visible = {}; LAYERS.forEach(l => visible[l.id] = true);

let view = { x: 0, y: 0, k: 1 };
let nodes = [];   // {rect,layer,node,idx}
let hover = null, selected = null, query = '';

function layout(){
  nodes = [];
  let y = PAD;
  const maxW = 6 * (BOX_W + GAP_X);
  for (const L of LAYERS){
    if (!visible[L.id]) continue;
    const perRow = Math.max(2, Math.min(6, L.nodes.length));
    const rows = Math.ceil(L.nodes.length / perRow);
    const bandH = HEAD + rows * (BOX_H + GAP_Y) + PAD;
    L._band = { x: PAD/2, y, w: maxW + PAD, h: bandH };
    L.nodes.forEach((n, i) => {
      const r = Math.floor(i / perRow), c = i % perRow;
      const rect = {
        x: PAD/2 + 70 + c * (BOX_W + GAP_X),
        y: y + HEAD + r * (BOX_H + GAP_Y),
        w: BOX_W, h: BOX_H
      };
      n._rect = rect;
      nodes.push({ rect, L, n, idx: nodes.length });
    });
    y += bandH;
  }
  return y;
}
let worldH = layout();

function fit(){
  const cw = cv.clientWidth, ch = cv.clientHeight;
  const w = 6 * (BOX_W + GAP_X) + PAD * 2 + 70;
  const k = Math.min(cw / w, ch / (worldH + PAD)) * 0.98;
  view.k = Math.max(0.25, Math.min(1.2, k));
  view.x = (cw - w * view.k) / 2;
  view.y = 8;
  draw();
}
function toWorld(px, py){ return { x:(px - view.x)/view.k, y:(py - view.y)/view.k }; }
function toScreen(wx, wy){ return { x: wx*view.k + view.x, y: wy*view.k + view.y }; }

function statusColor(st){
  return st === 'ok' ? '#3ddc97' : st === 'opt' ? '#b48cff'
       : st === 'warn' ? '#ffc857' : '#4f5f8a';
}
function statusText(st){
  return st === 'ok' ? '已验证' : st === 'opt' ? '默认关闭'
       : st === 'warn' ? '边界' : '稳定';
}
function matches(n){
  if (!query) return true;
  const q = query.toLowerCase();
  return (n.label + ' ' + (n.files||[]).join(' ') + ' ' + (n.role||'') + ' ' + (n.cfg||''))
    .toLowerCase().includes(q);
}

function roundRect(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}

function draw(){
  const dpr = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cv.clientWidth,cv.clientHeight);
  ctx.save();
  ctx.translate(view.x, view.y); ctx.scale(view.k, view.k);

  for (const L of LAYERS){
    if (!visible[L.id] || !L._band) continue;
    const b = L._band;
    // 层背景
    ctx.fillStyle = 'rgba(18,26,51,0.55)';
    roundRect(ctx, b.x, b.y, b.w, b.h, 12); ctx.fill();
    ctx.strokeStyle = L.color + '55'; ctx.lineWidth = 1; ctx.stroke();
    // 层标题竖排色条
    ctx.fillStyle = L.color;
    roundRect(ctx, b.x, b.y, 6, b.h, 3); ctx.fill();
    ctx.fillStyle = L.color;
    ctx.font = '600 15px "Segoe UI","Microsoft YaHei"';
    ctx.fillText(L.id + ' · ' + L.name, b.x + 18, b.y + 21);
    ctx.fillStyle = '#8fa0c8';
    ctx.font = '11px "Segoe UI"';
    ctx.fillText(L.nodes.length + ' modules', b.x + 18 + ctx.measureText(L.id+' · '+L.name).width + 14, b.y + 21);
  }

  for (const item of nodes){
    const {rect:r, L, n} = item;
    const vis = matches(n);
    const isSel = selected === item;
    const isHov = hover === item;
    let alpha = vis ? 1 : 0.16;
    ctx.globalAlpha = alpha;

    // 卡片
    const grad = ctx.createLinearGradient(r.x, r.y, r.x, r.y+r.h);
    grad.addColorStop(0, isSel ? '#22315e' : (isHov ? '#1b2749' : '#141d38'));
    grad.addColorStop(1, '#101730');
    ctx.fillStyle = grad;
    roundRect(ctx, r.x, r.y, r.w, r.h, 9); ctx.fill();
    ctx.strokeStyle = isSel ? '#ffffff' : (isHov ? L.color : L.color + '77');
    ctx.lineWidth = isSel ? 2 : 1; ctx.stroke();

    // 状态点
    ctx.fillStyle = statusColor(n.st);
    ctx.beginPath(); ctx.arc(r.x + 12, r.y + 14, 3.6, 0, 7); ctx.fill();

    // 标题（超出裁剪）
    ctx.save();
    ctx.beginPath(); roundRect(ctx, r.x+20, r.y+4, r.w-26, 20, 4); ctx.clip();
    ctx.fillStyle = '#e8eeff';
    ctx.font = '600 12.5px "Segoe UI","Microsoft YaHei"';
    ctx.fillText(n.label, r.x + 22, r.y + 18);
    ctx.restore();

    // 文件摘要
    const f0 = (n.files && n.files.length) ? n.files[0] : '（无独立文件·实现在共享 TU）';
    const extra = (n.files && n.files.length > 1) ? ('  +' + (n.files.length-1)) : '';
    ctx.save();
    ctx.beginPath(); roundRect(ctx, r.x+10, r.y+26, r.w-20, 16, 3); ctx.clip();
    ctx.fillStyle = '#7f92bb';
    ctx.font = '10.5px Consolas,monospace';
    ctx.fillText(f0 + extra, r.x + 12, r.y + 38);
    ctx.restore();

    // 职责前 12 字
    ctx.save();
    ctx.beginPath(); roundRect(ctx, r.x+10, r.y+42, r.w-20, 16, 3); ctx.clip();
    ctx.fillStyle = '#65799f';
    ctx.font = '10.5px "Segoe UI","Microsoft YaHei"';
    ctx.fillText((n.role||'').slice(0, 26), r.x + 12, r.y + 54);
    ctx.restore();

    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* ------------- 交互 ------------- */
let drag = null;
cv.addEventListener('mousedown', e => {
  drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false };
  cv.classList.add('dragging');
});
cv.addEventListener('mousemove', e => {
  if (drag){
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    view.x = drag.vx + dx; view.y = drag.vy + dy;
    draw(); return;
  }
  const w = toWorld(e.clientX - cv.getBoundingClientRect().left,
                    e.clientY - cv.getBoundingClientRect().top);
  hover = null;
  for (const it of nodes)
    if (w.x >= it.rect.x && w.x <= it.rect.x+it.rect.w &&
        w.y >= it.rect.y && w.y <= it.rect.y+it.rect.h){ hover = it; break; }
  cv.style.cursor = hover ? 'pointer' : 'grab';
  draw();
  if (hover) showTip(hover, e); else hideTip();
});
cv.addEventListener('mouseup', e => {
  cv.classList.remove('dragging');
  if (drag && !drag.moved){
    const r = cv.getBoundingClientRect();
    const w = toWorld(e.clientX - r.left, e.clientY - r.top);
    let hit = null;
    for (const it of nodes)
      if (w.x >= it.rect.x && w.x <= it.rect.x+it.rect.w &&
          w.y >= it.rect.y && w.y <= it.rect.y+it.rect.h){ hit = it; break; }
    selected = hit; draw(); if (hit) showPanel(hit);
  }
  drag = null;
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const before = toWorld(mx, my);
  view.k *= (e.deltaY < 0 ? 1.12 : 1/1.12);
  view.k = Math.max(0.2, Math.min(2.6, view.k));
  const after = toWorld(mx, my);
  view.x += (after.x - before.x) * view.k;
  view.y += (after.y - before.y) * view.k;
  draw();
}, {passive:false});
cv.addEventListener('dblclick', () => fit());

let tipEl = null;
function showTip(it, e){
  if (!tipEl){
    tipEl = document.createElement('div');
    tipEl.style.cssText = 'position:fixed;z-index:9;max-width:320px;padding:7px 10px;'+
      'background:#0a1226ee;border:1px solid #26325c;border-radius:7px;font-size:11.5px;'+
      'color:#cfe0ff;pointer-events:none;box-shadow:0 6px 20px #0008';
    document.body.appendChild(tipEl);
  }
  tipEl.innerHTML = '<b>' + it.n.label + '</b><br><span style="color:#8fa0c8">'
    + (it.n.role||'').slice(0,90) + '…</span>';
  tipEl.style.left = (e.clientX + 14) + 'px';
  tipEl.style.top  = (e.clientY + 14) + 'px';
  tipEl.style.display = 'block';
}
function hideTip(){ if (tipEl) tipEl.style.display = 'none'; }

function showPanel(it){
  const n = it.n, L = it.L;
  const files = (n.files||[]).length
    ? (n.files||[]).map(f => '<span class="file">'+f+'</span>').join('')
    : '<span class="empty">该节点没有独立文件：能力实现在共享编译单元内（见右侧配置与职责）。</span>';
  panel.innerHTML =
    '<h3>'+n.label+'</h3>'+
    '<div class="sub">'+L.id+' · '+L.name+
      ' &nbsp;<span class="badge" style="color:'+statusColor(n.st)+'">'+statusText(n.st)+'</span></div>'+
    '<div class="sec">职责</div><p>'+(n.role||'—')+'</p>'+
    '<div class="sec">文件 ('+ (n.files||[]).length +')</div><div class="files">'+files+'</div>'+
    '<div class="sec">配置 / 开关</div><p><code>'+(n.cfg||'—')+'</code></p>';
}

/* ------------- 左侧层次开关 ------------- */
function renderLayers(){
  layersEl.innerHTML = '';
  for (const L of LAYERS){
    const d = document.createElement('div');
    d.className = 'layerToggle';
    d.innerHTML = '<span class="sw" style="background:'+L.color+'"></span>'+
      '<span class="n">'+L.id+' '+L.name+'</span><span class="c">'+L.nodes.length+'</span>';
    d.onclick = () => {
      visible[L.id] = !visible[L.id];
      d.style.opacity = visible[L.id] ? 1 : .38;
      worldH = layout(); fit();
    };
    layersEl.appendChild(d);
  }
}

/* ------------- 覆盖检查 ------------- */
function audit(){
  const totalNodes = LAYERS.reduce((a,L)=>a+L.nodes.length,0);
  const allFiles = new Set();
  LAYERS.forEach(L=>L.nodes.forEach(n=>(n.files||[]).forEach(f=>allFiles.add(f))));
  const byLayer = LAYERS.map(L=>L.id+':'+L.nodes.length).join(' · ');
  const okN = LAYERS.reduce((a,L)=>a+L.nodes.filter(n=>n.st==='ok').length,0);
  const optN = LAYERS.reduce((a,L)=>a+L.nodes.filter(n=>n.st==='opt').length,0);
  auditEl.innerHTML =
    '<b>'+LAYERS.length+'</b> 层 / <b>'+totalNodes+'</b> 节点 / <b>'+allFiles.size+'</b> 文件条目<br>'+
    '<span class="k">'+byLayer+'</span><br>'+
    '<span style="color:#3ddc97">已验证 '+okN+'</span> · '+
    '<span style="color:#b48cff">默认关闭 '+optN+'</span>';
  statEl.textContent = LAYERS.length+' 层 · '+totalNodes+' 模块 · '+allFiles.size+' 文件';
}

  indexEl.style.display = 'block';
};

/* ------------- 搜索 ------------- */
const searchEl = document.getElementById('search');
let t = null;
searchEl.addEventListener('input', () => {
  clearTimeout(t);
  t = setTimeout(() => {
    query = searchEl.value.trim();
    draw();
    if (query){
      const hits = nodes.filter(it => matches(it.n));
      if (hits.length === 1){ selected = hits[0]; draw(); showPanel(hits[0]); }
    }
  }, 120);
});
window.addEventListener('keydown', e => {
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); searchEl.focus(); }
  if (e.key === 'Escape'){ query=''; searchEl.value=''; selected=null; draw(); }
});
document.getElementById('fitBtn').onclick = () => fit();
window.addEventListener('resize', () => { draw(); });

/* ------------- 启动 ------------- */
renderLayers();
audit();
requestAnimationFrame(() => { fit(); });
</script>
</body>
</html>
